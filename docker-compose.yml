
services:
  taavon-frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: taavon-frontend

    restart: always

    working_dir: /app

    volumes:
      - /srv/taavon-frontend:/apptaavon-frontend

    labels:
      - "traefik.enable=true"

      # router
      - "traefik.http.routers.taavon-frontend.rule=Host(`doctorjaryan.ir`)"
      - "traefik.http.routers.taavon-frontend.entrypoints=websecure"
      - "traefik.http.routers.taavon-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.taavon-frontend.service=taavon-frontend"

      # service
      - "traefik.http.services.taavon-frontend.loadbalancer.server.port=80"

    networks:
      - proxy

networks:
  proxy:
    external: true
